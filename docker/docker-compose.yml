name: redesblog

services:
    app:
        build:
            context: ..
            dockerfile: docker/Dockerfile
            args:
                UID: ${UID:-1000}
                GID: ${GID:-1000}
        restart: unless-stopped
        env_file: ../.env
        volumes:
            - ..:/var/www/html
            - /var/www/html/node_modules
        ports:
            - '${VITE_PORT:-5173}:5173'
        depends_on:
            postgres:
                condition: service_healthy
            minio:
                condition: service_healthy
        networks:
            - redesblog

    nginx:
        image: nginx:1.29-alpine
        restart: unless-stopped
        ports:
            - '${APP_PORT:-8000}:80'
        volumes:
            - ..:/var/www/html:ro
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        networks:
            - redesblog

    postgres:
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        volumes:
            - postgres-data:/var/lib/postgresql/data
            - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test:
                ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}']
            interval: 5s
            timeout: 5s
            retries: 20
        networks:
            - redesblog

    pgadmin:
        image: dpage/pgadmin4:latest
        restart: unless-stopped
        environment:
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@redesblog.test}
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
            PGADMIN_CONFIG_SERVER_MODE: 'False'
            PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
            # pgAdmin refuses to boot with a reserved TLD in the login e-mail,
            # which is exactly what the local `.test` domain uses.
            PGADMIN_CONFIG_ALLOW_SPECIAL_EMAIL_DOMAINS: "['test', 'local', 'localhost']"
        ports:
            - '${FORWARD_PGADMIN_PORT:-8080}:80'
        volumes:
            - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
            - pgadmin-data:/var/lib/pgadmin
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - redesblog

    minio:
        image: minio/minio:latest
        restart: unless-stopped
        command: server /data --console-address ":8900"
        environment:
            MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-redesblog}
            MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-password}
        ports:
            - '${FORWARD_MINIO_PORT:-9000}:9000'
            - '${FORWARD_MINIO_CONSOLE_PORT:-8900}:8900'
        volumes:
            - minio-data:/data
        healthcheck:
            test: ['CMD', 'mc', 'ready', 'local']
            interval: 5s
            timeout: 5s
            retries: 20
        networks:
            - redesblog

    createbuckets:
        image: minio/mc:latest
        depends_on:
            minio:
                condition: service_healthy
        environment:
            AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-redesblog}
            AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-password}
            AWS_BUCKET: ${AWS_BUCKET:-redesblog}
        entrypoint: >
            /bin/sh -c "
            mc alias set local http://minio:9000 $${AWS_ACCESS_KEY_ID} $${AWS_SECRET_ACCESS_KEY};
            mc mb --ignore-existing local/$${AWS_BUCKET};
            mc anonymous set download local/$${AWS_BUCKET};
            exit 0;
            "
        networks:
            - redesblog

volumes:
    postgres-data:
    pgadmin-data:
    minio-data:

networks:
    redesblog:
        driver: bridge
